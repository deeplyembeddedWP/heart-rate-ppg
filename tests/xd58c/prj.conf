# Enable Zephyr testing framework infrastructure
CONFIG_ZTEST=y

# Enable built-in Unity test harness support
CONFIG_UNITY=y

# Enable Zephyr Logging Framework
CONFIG_LOG=y

# xd58c.c is compiled directly into this test (see xd58c_test.c), bypassing
# the XD58C_FFT_BPM Kconfig option that would normally `select` these for the
# app build -- so arm_math.h and the CMSIS-DSP symbols it calls need to be
# pulled in explicitly here.
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_WINDOW=y
